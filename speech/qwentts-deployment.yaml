# qwentts.cpp — Qwen3-TTS with zero-shot voice cloning, on the AMD RX 6650 XT.
#
# WHY THE AMD AND NOT THE 1070 Ti: measured 2026-08-05 with identical text and voice —
#   GTX 1070 Ti (Vulkan): 7.94s for 4.56s of audio = 0.57x realtime (slower than speech)
#   RX 6650 XT (Vulkan):  1.30s for 4.64s of audio = 3.6x realtime
# ~6x apart, and ggml reports why: Pascal advertises "fp16: 0" to Vulkan while RDNA2
# advertises "fp16: dot2". Running this on the NVIDIA would have been the wrong call.
#
# This ALSO leaves the 1070 Ti entirely to Whisper + Kokoro, so no GPU time-slicing of
# nvidia.com/gpu is needed — the two speech engines sit on separate cards.
#
# WHY NOT ROCm: not installed, and AMD does not officially support gfx1032. Vulkan needs
# none of it — mesa/RADV is already present for Jellyfin's VAAPI.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwentts
  labels:
    app.kubernetes.io/name: qwentts
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: qwentts
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qwentts
    spec:
      nodeSelector:
        kubernetes.io/hostname: ripnix
      containers:
        - name: qwentts
          # Built locally by nix (dockerTools) from /etc/nixos/qwentts-image.nix and
          # imported with `k3s ctr images import`. It exists in no registry, so the pull
          # policy MUST be Never or the kubelet will try to fetch it and fail ImagePullBackOff.
          image: docker.io/library/qwentts:vulkan
          imagePullPolicy: Never
          args:
            - --model
            - /models/qwen3-tts/qwen-talker-1.7b-base-Q8_0.gguf
            # BASE, not customvoice. These are mutually exclusive modes and an earlier
            # revision had them backwards:
            #   base        -> zero-shot voice CLONING from a reference clip
            #   customvoice -> nine fixed named speakers, no cloning
            # Registering a voice against customvoice fails outright with
            #   "qt_extract_voice_ref: voice references are only valid for base models".
            #
            # Only one of them fits: ggml-vulkan reserves ~98% of the 8 GB card for a
            # single 2 GB model, so loading both dropped synthesis from 1.1s to 5.2s
            # (0.82x realtime, i.e. slower than speech). Cloning was chosen over the
            # fixed speaker set because cloned voices are the point of running Qwen3 at
            # all — Kokoro already provides fixed voices, on the other GPU.
            #
            # The base checkpoint still has a usable default voice when no `voice` is
            # given, so this does not leave the deployment voiceless.
            #
            # The cloned-voice registry (g_voices in tts-server.cpp) is in-memory with
            # no save/load, so it does NOT survive a restart on its own — the
            # voice-store sidecar below owns the clips on disk and re-registers them.
            - --codec
            - /models/qwen3-tts/qwen-tokenizer-12hz-Q8_0.gguf
            - --alias
            - qwen3-tts
            # Default is 1, which serialises requests on the GPU. The UI synthesises the
            # next sentence while the current one plays (up to 3 in flight), so without
            # this those requests queue instead of batching and the prefetch buys nothing.
            - --max-batch
            - "4"
            - --host
            - 0.0.0.0
            - --port
            - "8080"
          ports:
            - containerPort: 8080
              name: http
          resources:
            limits:
              # Supplied by generic-device-plugin (declared in /etc/nixos/k3s.nix), which
              # maps to /dev/dri/renderD129. This request is what grants cgroup permission
              # to open the node — a hostPath mount alone is not enough.
              devic.es/dri: 1
              memory: 8Gi
            requests:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: models
              # Not readOnly: the voice-store sidecar writes cloned clips under
              # /models/qwen3-tts/voices on the same volume.
              mountPath: /models
          startupProbe:
            httpGet:
              path: /v1/models
              port: 8080
            periodSeconds: 10
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /v1/models
              port: 8080
            periodSeconds: 60
            timeoutSeconds: 15
            failureThreshold: 5
        # Sidecar: durable storage for cloned voices. tts-server keeps its registry
        # in memory with no save/load, so without this every pod restart and every
        # Flux redeploy wipes every cloned voice. Keeping the clips in the browser
        # would fix restarts but not devices — a voice cloned on a phone would be
        # invisible from a desktop. This owns them on disk and re-registers on boot.
        #
        # Same pod, so it reaches tts-server on 127.0.0.1 and shares /models.
        - name: voice-store
          image: docker.io/python:3.12-alpine
          command: ["python3", "/app/voice-store.py"]
          env:
            - name: VOICE_STORE
              value: /models/qwen3-tts/voices
            - name: TTS_UPSTREAM
              value: http://127.0.0.1:8080
            - name: PORT
              value: "8090"
          ports:
            - containerPort: 8090
              name: store
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: models
              mountPath: /models
            - name: voice-store-script
              mountPath: /app
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8090
            periodSeconds: 10
      volumes:
        - name: models
          hostPath:
            path: /models
            type: Directory
        - name: voice-store-script
          configMap:
            name: voice-store
