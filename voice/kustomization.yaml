apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: voice

resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml

# Kept as real files rather than inline YAML so the page and nginx config stay
# diffable and editable. The generated name hash changes when either file changes,
# which rolls the pod automatically — otherwise nginx would keep serving the old
# page from a mounted ConfigMap.
configMapGenerator:
  - name: voice-site
    files:
      - index.html
  - name: voice-nginx
    files:
      - nginx.conf

labels:
  - pairs:
      app.kubernetes.io/part-of: deepseek-oci
