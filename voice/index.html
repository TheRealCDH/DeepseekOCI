<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111418">
<title>Voice</title>
<style>
  :root { --bg:#111418; --panel:#1a1f26; --fg:#e8edf4; --dim:#8b97a8; --accent:#4b9fff; --rec:#ff4b5c; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  header { padding: 12px 16px; border-bottom: 1px solid #262d36; display: flex; align-items: center; gap: 12px; }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: .02em; }
  #status { font-size: 13px; color: var(--dim); margin-left: auto; text-align: right; }
  #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 90%; padding: 10px 13px; border-radius: 14px; white-space: pre-wrap; word-wrap: break-word; }
  .me { align-self: flex-end; background: #2a3a52; border-bottom-right-radius: 4px; }
  .ai { align-self: flex-start; background: var(--panel); border-bottom-left-radius: 4px; }
  .err { align-self: stretch; background: #3a1f24; color: #ffb3bb; font-size: 14px; border-radius: 10px; }
  .think { align-self: flex-start; color: var(--dim); font-size: 13px; font-style: italic; }
  footer { padding: 14px 16px calc(18px + env(safe-area-inset-bottom)); border-top: 1px solid #262d36; display: flex; flex-direction: column; gap: 12px; }
  footer .row { display: flex; align-items: center; gap: 14px; width: 100%; }
  #textrow { display: flex; gap: 10px; width: 100%; }
  #text { flex: 1; min-width: 0; background: var(--panel); color: var(--fg); font-size: 16px;
          border: 1px solid #333c48; border-radius: 11px; padding: 11px 13px; }
  #text:focus { outline: none; border-color: var(--accent); }
  #send { flex: none; width: 46px; border: none; border-radius: 11px; background: var(--accent);
          color: #fff; font-size: 17px; cursor: pointer; }
  #send:disabled { background: #39424e; color: #7e8896; }
  #mic {
    width: 68px; height: 68px; border-radius: 50%; border: none; flex: none;
    background: var(--accent); color: #fff; font-size: 27px; cursor: pointer;
    display: grid; place-items: center; transition: background .15s, transform .1s;
  }
  #mic:active { transform: scale(.94); }
  #mic.rec { background: var(--rec); animation: pulse 1.3s ease-in-out infinite; }
  #mic:disabled { background: #39424e; color: #7e8896; }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(255,75,92,.55); } 50% { box-shadow: 0 0 0 15px rgba(255,75,92,0); } }
  .opts { display: flex; flex-direction: column; gap: 7px; font-size: 14px; color: var(--dim); }
  .opts label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
  input[type=checkbox] { width: 17px; height: 17px; accent-color: var(--accent); }
  select { background: var(--panel); color: var(--fg); border: 1px solid #333c48;
           border-radius: 7px; padding: 3px 6px; font-size: 13px; }
</style>
</head>
<body>
<header>
  <h1>Voice</h1>
  <div id="status">idle</div>
</header>
<div id="log"></div>
<footer>
  <form id="textrow" autocomplete="off">
    <input id="text" type="text" placeholder="Type a message…" enterkeyhint="send">
    <button id="send" type="submit" aria-label="Send">&#10148;</button>
  </form>
  <div class="row">
  <button id="mic" aria-label="Record">&#127908;</button>
  <div class="opts">
    <label><input type="checkbox" id="thinking" checked> Thinking (slower, better)</label>
    <label><input type="checkbox" id="speak" checked> Speak replies</label>
    <label>Engine
      <select id="engine">
        <option value="qwen" selected>Qwen3 (cloning)</option>
        <option value="kokoro">Kokoro (faster)</option>
      </select>
    </label>
    <label>Voice
      <select id="voice"><option value="ryan">ryan</option></select>
    </label>
    <label>Speed
      <input id="speed" type="range" min="1" max="1.6" step="0.05" value="1.15">
      <span id="speedval">1.15x</span>
    </label>
  </div>
  </div>
</footer>

<script>
// Same-origin: nginx serves this page AND proxies /v1/* to speaches and llama.cpp,
// so there is no CORS to configure and one HTTPS cert covers everything.
const STT_MODEL = "deepdml/faster-whisper-large-v3-turbo-ct2";

// Two TTS engines on two different GPUs, so they never contend:
//   qwen   -> qwentts.cpp / Qwen3-TTS on the AMD RX 6650 XT. 3.6x realtime, and the
//             only one that can clone a voice. DEFAULT.
//   kokoro -> Kokoro via speaches on the GTX 1070 Ti. Faster (7.7x) but a fixed voice
//             set and no cloning. Kept as a fallback, including for when the AMD is
//             busy transcoding.
// Payload shapes differ: qwentts infers the model from its --alias and takes a bare
// speaker name; speaches needs an explicit model id and a Kokoro voice id.
const ENGINES = {
  qwen: {
    label: "Qwen3",
    url: "/v1/audio/speech",
    voicesUrl: "/v1/audio/voices",
    body: (t) => ({
      input: t,
      voice: voiceEl.value || "ryan",
      response_format: "wav",
      // Guards against the model looping into breathing/panting noises — a known
      // failure mode of autoregressive TTS, where the sampler gets stuck emitting
      // the same acoustic tokens forever. The engine's sampling chain is
      // repetition penalty -> temperature -> top-k -> top-p, so a penalty above 1
      // plus a slightly conservative temperature makes the loop far less likely.
      repetition_penalty: 1.1,
      temperature: 0.7,
      top_p: 0.9,
    }),
  },
  kokoro: {
    label: "Kokoro",
    url: "/kokoro/v1/audio/speech",
    body: (t) => ({
      model: "speaches-ai/Kokoro-82M-v1.0-ONNX",
      input: t,
      voice: "af_heart",
      response_format: "wav",
    }),
  },
};

const logEl = document.getElementById("log");
const micEl = document.getElementById("mic");
const statusEl = document.getElementById("status");
const thinkEl = document.getElementById("thinking");
const speakEl = document.getElementById("speak");
const engineEl = document.getElementById("engine");
const voiceEl = document.getElementById("voice");
const speedEl = document.getElementById("speed");
const speedValEl = document.getElementById("speedval");
speedEl.addEventListener("input", () => { speedValEl.textContent = (+speedEl.value).toFixed(2) + "x"; });

// The engines have disjoint voice sets, so repopulate whenever the engine changes.
const KOKORO_VOICES = ["af_heart", "af_bella", "af_nicole", "am_michael", "bf_emma", "bm_george"];
async function loadVoices() {
  const eng = engineEl.value;
  let names = KOKORO_VOICES;
  if (eng === "qwen") {
    try {
      const r = await fetch(ENGINES.qwen.voicesUrl);
      const d = await r.json();
      names = (d.voices || []).map((v) => v.name);
    } catch { names = ["ryan"]; }
  }
  voiceEl.innerHTML = "";
  for (const n of names) {
    const o = document.createElement("option");
    o.value = n; o.textContent = n;
    voiceEl.appendChild(o);
  }
}
engineEl.addEventListener("change", loadVoices);
loadVoices();

let recorder = null, chunks = [], recording = false, busy = false;
let audioCtx = null;
const history = [];

function setStatus(t) { statusEl.textContent = t; }
function add(cls, text) {
  const d = document.createElement("div");
  d.className = "msg " + cls;
  d.textContent = text;
  logEl.appendChild(d);
  logEl.scrollTop = logEl.scrollHeight;
  return d;
}

// ---- audio pipeline ------------------------------------------------------
// Synthesis and playback run CONCURRENTLY. An earlier version awaited the fetch
// and then awaited playback in the same loop, so every sentence was preceded by
// a 0.3-1.4s silence while the next one was synthesised, and the GPU sat idle
// for the whole time audio was playing. Measured: the engine renders ~3.5x
// faster than realtime, so if the next sentence is fetched while the current one
// plays, it is always ready before it is needed and playback becomes gapless.
//
// Order matters, so each sentence gets a slot holding a promise for its audio;
// the player awaits slots in order while the fetcher runs ahead of it.
const slots = [];
let fetching = 0;
let playing = false;
const MAX_INFLIGHT = 3;   // matches the server's --max-batch

function synth(text) {
  const eng = ENGINES[engineEl.value] || ENGINES.qwen;
  return fetch(eng.url, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(eng.body(text))
  }).then((r) => {
    if (!r.ok) throw new Error(eng.label + " TTS " + r.status);
    return r.arrayBuffer();
  });
}

async function enqueue(text) {
  if (!speakEl.checked || !text.trim()) return;
  // Kick the request off IMMEDIATELY rather than when its turn comes.
  slots.push(synth(text.trim()));
  if (!playing) play();
}

async function play() {
  playing = true;
  while (slots.length) {
    const slot = slots.shift();
    try {
      await playPCM(await slot);
    } catch (e) {
      add("err", "Speech failed: " + e.message);
    }
  }
  playing = false;
}

// Playback. Qwen3 speaks at ~127 wpm against ~150 for normal conversation, and the
// engine exposes no speed parameter, so the correction has to happen client side.
//
// An <audio> element is preferred because preservesPitch time-stretches WITHOUT the
// chipmunk effect; AudioBufferSourceNode.playbackRate would shift pitch instead. The
// AudioContext is still created on the first user gesture and kept as a fallback,
// since it is the path already proven to satisfy Android's autoplay policy.
function playPCM(arrayBuffer) {
  const rate = +speedEl.value || 1;
  return new Promise((resolve) => {
    const url = URL.createObjectURL(new Blob([arrayBuffer], { type: "audio/wav" }));
    const a = new Audio();
    a.preservesPitch = true;
    a.mozPreservesPitch = true;
    a.webkitPreservesPitch = true;
    a.playbackRate = rate;
    a.src = url;
    const done = () => { URL.revokeObjectURL(url); resolve(); };
    a.onended = done;
    a.onerror = () => { URL.revokeObjectURL(url); playViaWebAudio(arrayBuffer, rate).then(resolve, resolve); };
    a.play().catch(() => {
      URL.revokeObjectURL(url);
      playViaWebAudio(arrayBuffer, rate).then(resolve, resolve);
    });
  });
}

function playViaWebAudio(arrayBuffer, rate) {
  return new Promise((resolve, reject) => {
    if (!audioCtx) { resolve(); return; }
    audioCtx.decodeAudioData(arrayBuffer.slice(0), (buf) => {
      const src = audioCtx.createBufferSource();
      src.buffer = buf;
      src.playbackRate.value = rate;   // shifts pitch, but only used as a fallback
      src.connect(audioCtx.destination);
      src.onended = resolve;
      src.start();
    }, reject);
  });
}

// ---- recording ------------------------------------------------------------
async function startRec() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    add("err", "Microphone unavailable. This page must be served over HTTPS — getUserMedia is blocked on plain HTTP everywhere except localhost.");
    return;
  }
  // Must be created/resumed inside the tap handler for Android autoplay rules.
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === "suspended") await audioCtx.resume();

  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (e) {
    add("err", "Mic permission denied: " + e.name);
    return;
  }

  // Android Chrome gives webm/opus; desktop Safari gives mp4. Let the browser
  // pick and tell the server via the filename extension.
  let mime = "";
  for (const m of ["audio/webm;codecs=opus", "audio/webm", "audio/mp4", "audio/ogg;codecs=opus"]) {
    if (window.MediaRecorder && MediaRecorder.isTypeSupported(m)) { mime = m; break; }
  }
  recorder = mime ? new MediaRecorder(stream, { mimeType: mime }) : new MediaRecorder(stream);
  chunks = [];
  recorder.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
  recorder.onstop = () => {
    stream.getTracks().forEach((t) => t.stop());
    handleAudio(new Blob(chunks, { type: recorder.mimeType || "audio/webm" }));
  };
  recorder.start();
  recording = true;
  micEl.classList.add("rec");
  setStatus("listening…");
}

function stopRec() {
  if (recorder && recorder.state !== "inactive") recorder.stop();
  recording = false;
  micEl.classList.remove("rec");
}

// Text path. Shares ask() with the voice path, so replies stream and are spoken
// identically whichever way the question arrived — the TTS toggle still applies.
const textEl = document.getElementById("text");
const sendEl = document.getElementById("send");
document.getElementById("textrow").addEventListener("submit", async (e) => {
  e.preventDefault();
  const q = textEl.value.trim();
  if (!q || busy) return;
  textEl.value = "";
  // Typing is a user gesture, so unlock audio here too — otherwise the first spoken
  // reply after a text-only start is silently blocked by Android's autoplay policy.
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === "suspended") await audioCtx.resume();
  add("me", q);
  busy = true; micEl.disabled = true; sendEl.disabled = true;
  try {
    await ask(q);
  } catch (err) {
    add("err", err.message);
  } finally {
    busy = false; micEl.disabled = false; sendEl.disabled = false; setStatus("idle");
  }
});

micEl.addEventListener("click", async () => {
  if (busy) return;
  if (recording) stopRec(); else await startRec();
});

// ---- pipeline -------------------------------------------------------------
async function handleAudio(blob) {
  busy = true; micEl.disabled = true;
  setStatus("transcribing…");
  try {
    const ext = (blob.type.includes("mp4") ? "mp4" : blob.type.includes("ogg") ? "ogg" : "webm");
    const fd = new FormData();
    fd.append("file", blob, "speech." + ext);
    fd.append("model", STT_MODEL);
    const r = await fetch("/v1/audio/transcriptions", { method: "POST", body: fd });
    if (!r.ok) throw new Error("STT " + r.status + " " + (await r.text()).slice(0, 120));
    const said = (await r.json()).text.trim();
    if (!said) { setStatus("nothing heard"); return; }
    add("me", said);
    await ask(said);
  } catch (e) {
    add("err", e.message);
  } finally {
    busy = false; micEl.disabled = false; sendEl.disabled = false; setStatus("idle");
  }
}

// Splits the stream on sentence boundaries so TTS can start early.
function cutSentences(buf) {
  const out = [];
  let m;
  const re = /[^.!?]+[.!?]+["')\]]*\s*/g;
  let last = 0;
  while ((m = re.exec(buf)) !== null) { out.push(m[0]); last = re.lastIndex; }
  return { done: out, rest: buf.slice(last) };
}

async function ask(text) {
  history.push({ role: "user", content: text });
  setStatus(thinkEl.checked ? "thinking…" : "answering…");

  const body = {
    messages: history,
    max_tokens: 900,
    stream: true,
    // Per-request, so voice and text sessions can differ without redeploying.
    // Thinking off ≈ 0.6s to first word; on ≈ 14-24s but better answers.
    chat_template_kwargs: { thinking: thinkEl.checked }
  };

  const r = await fetch("/v1/chat/completions", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body)
  });
  if (!r.ok) throw new Error("LLM " + r.status + " " + (await r.text()).slice(0, 120));

  const reader = r.body.getReader();
  const dec = new TextDecoder();
  let sse = "", spoken = "", full = "";
  let bubble = null, thinkNote = null;

  while (true) {
    const { value, done } = await reader.read();
    if (done) break;
    sse += dec.decode(value, { stream: true });
    const lines = sse.split("\n");
    sse = lines.pop();
    for (const line of lines) {
      if (!line.startsWith("data:")) continue;
      const p = line.slice(5).trim();
      if (p === "[DONE]") continue;
      let d; try { d = JSON.parse(p); } catch { continue; }
      const delta = (d.choices && d.choices[0] && d.choices[0].delta) || {};

      if (delta.reasoning_content && !thinkNote && !full) {
        thinkNote = add("think", "thinking…");
      }
      if (delta.content) {
        if (thinkNote) { thinkNote.remove(); thinkNote = null; }
        if (!bubble) { bubble = add("ai", ""); setStatus("speaking…"); }
        full += delta.content;
        bubble.textContent = full;
        logEl.scrollTop = logEl.scrollHeight;

        const pending = full.slice(spoken.length);
        const { done: sentences, rest } = cutSentences(pending);
        if (sentences.length) {
          const chunk = sentences.join("");
          spoken += chunk;
          enqueue(chunk);
        }
      }
    }
  }

  // Anything after the last sentence terminator.
  const tail = full.slice(spoken.length).trim();
  if (tail) enqueue(tail);
  if (full) history.push({ role: "assistant", content: full });
  if (!full) add("err", "Model returned no speakable content (it may have spent the whole budget thinking).");
}

// Surface the HTTPS requirement immediately rather than on first tap.
if (!window.isSecureContext) {
  add("err", "Not a secure context — the microphone will not work. Use the https:// address.");
}
</script>
</body>
</html>
