# Static voice UI + same-origin reverse proxy for both APIs.
#
# WHY A PROXY RATHER THAN CALLING THE APIS DIRECTLY: the browser would otherwise make
# cross-origin requests to speaches and llama.cpp, neither of which sends CORS headers
# (speaches ships allow_origins=None). Serving the page and proxying /v1/* from one
# origin sidesteps CORS entirely and means a single TLS cert covers the whole app.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: voice-ui
  labels:
    app.kubernetes.io/name: voice-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: voice-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: voice-ui
    spec:
      nodeSelector:
        kubernetes.io/hostname: ripnix
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            - name: site
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
            - name: conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: nginx.conf
          resources:
            requests:
              cpu: 10m
              memory: 24Mi
            limits:
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 30
      volumes:
        - name: site
          configMap:
            name: voice-site
        - name: conf
          configMap:
            name: voice-nginx
