server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Uploaded speech clips; a long utterance as webm/opus is still small, but the
    # 1 MiB default would reject anything past a few seconds.
    client_max_body_size 32m;

    location = / {
        add_header Cache-Control "no-store";
        try_files /index.html =404;
    }

    # Speech: STT + TTS. Long timeouts because a cold model load on the first
    # request after a pod restart can take tens of seconds.
    # TTS DEFAULT -> qwentts.cpp (Qwen3-TTS) on the AMD card. Measured 3.6x realtime
    # there versus 0.57x on the NVIDIA, and unlike Kokoro it can clone a voice.
    # nginx picks the LONGEST matching prefix, so this wins over /v1/audio/ below.
    location /v1/audio/speech {
        proxy_pass http://qwentts.speech.svc.cluster.local:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_request_buffering off;
    }

    # Named speakers and any registered cloned voices come from qwentts too.
    location /v1/audio/voices {
        proxy_pass http://qwentts.speech.svc.cluster.local:8080;
        proxy_http_version 1.1;
        proxy_read_timeout 120s;
    }

    # FALLBACK -> Kokoro via speaches, reachable at /kokoro/v1/audio/speech.
    # Kept because it is the faster engine (7.7x realtime) when cloning is not wanted,
    # and because it lives on the other GPU, so it still works if the AMD is busy
    # transcoding.
    location /kokoro/v1/audio/ {
        rewrite ^/kokoro(/.*)$ $1 break;
        proxy_pass http://speaches.speech.svc.cluster.local:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_request_buffering off;
    }

    # STT stays on speaches (faster-whisper, NVIDIA) — qwentts is TTS only.
    location /v1/audio/ {
        proxy_pass http://speaches.speech.svc.cluster.local:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_request_buffering off;
    }

    # LLM. proxy_buffering MUST be off or nginx accumulates the SSE stream and
    # delivers it in one lump at the end — which would silently defeat the whole
    # point of sentence-chunked streaming TTS.
    location /v1/chat/ {
        proxy_pass http://deepseek.deepseek.svc.cluster.local:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    location /v1/models {
        proxy_pass http://deepseek.deepseek.svc.cluster.local:8080;
        proxy_http_version 1.1;
        proxy_read_timeout 120s;
    }

    location /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
