server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Uploaded speech clips; a long utterance as webm/opus is still small, but the
    # 1 MiB default would reject anything past a few seconds.
    client_max_body_size 32m;

    location = / {
        add_header Cache-Control "no-store";
        try_files /index.html =404;
    }

    # Speech: STT + TTS. Long timeouts because a cold model load on the first
    # request after a pod restart can take tens of seconds.
    location /v1/audio/ {
        proxy_pass http://speaches.speech.svc.cluster.local:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_request_buffering off;
    }

    # LLM. proxy_buffering MUST be off or nginx accumulates the SSE stream and
    # delivers it in one lump at the end — which would silently defeat the whole
    # point of sentence-chunked streaming TTS.
    location /v1/chat/ {
        proxy_pass http://deepseek.deepseek.svc.cluster.local:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    location /v1/models {
        proxy_pass http://deepseek.deepseek.svc.cluster.local:8080;
        proxy_http_version 1.1;
        proxy_read_timeout 120s;
    }

    location /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
