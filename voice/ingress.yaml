# HTTPS on the tailnet, terminated by the Tailscale operator with a genuine
# Let's Encrypt certificate for the *.ts.net name.
#
# THIS IS NOT OPTIONAL POLISH — it is what makes the app work at all on a phone.
# getUserMedia() (the microphone) is refused outside a secure context by every
# modern browser. Chromium normally offers an escape hatch at
# chrome://flags/#unsafely-treat-insecure-origin-as-secure, but GrapheneOS's
# Vanadium strips the chrome://flags UI entirely, so there is no override there.
# A real LE cert also avoids making the user install a private CA.
#
# The hostname comes from tls.hosts[0] -> https://voice.<tailnet>.ts.net
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: voice
  annotations:
    tailscale.com/tags: "tag:k8s-operator"
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: voice-ui
      port:
        number: 80
  tls:
    - hosts:
        - voice
